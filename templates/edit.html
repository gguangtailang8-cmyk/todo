<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <title>タスクを編集</title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='style.css') }}"
    >
</head>

<body>

<div class="container">

    <h1>✏️ タスクを編集</h1>

    <form method="POST" class="add-form">

        <input
            type="text"
            name="task"
            value="{{ task['name'] }}"
            required
        >

        <input
            type="date"
            name="due_date"
            value="{{ task['due_date'] or '' }}"
        >

        <button type="submit">
            保存
        </button>

    </form>

    <a href="/">
        ← ToDoリストに戻る
    </a>

</div>

</body>

</html>
